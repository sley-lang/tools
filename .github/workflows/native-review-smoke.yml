name: Native review smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/native-review-smoke.yml
      - evidence/review/fixtures/release-readiness/**
      - programs/release-readiness/tests/bridge-cases.json

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Review checked-in fixture on manual dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./actions/check
        with:
          before: evidence/review/fixtures/release-readiness/before/program.json
          after: evidence/review/fixtures/release-readiness/after/program.json
          cases: programs/release-readiness/tests/bridge-cases.json
          artifact-name: sley-native-review-smoke
      - name: Review submitted fixture
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./actions/check
        with:
          before: evidence/review/fixtures/release-readiness/before/program.json
          after: evidence/review/fixtures/release-readiness/after/program.json
          cases: programs/release-readiness/tests/bridge-cases.json
          artifact-name: sley-native-review-pr
